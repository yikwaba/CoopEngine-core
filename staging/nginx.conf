events {}
http {
  server {
    listen 8080;
    add_header X-CoopEngine-Environment isolated-synthetic always;
    location / { proxy_pass http://api:4399; proxy_set_header Host $host; }
  }
  server {
    listen 8081;
    add_header X-CoopEngine-Environment isolated-synthetic always;
    location / { proxy_pass http://portal:3100; proxy_set_header Host $host; }
  }
  server {
    listen 8082;
    add_header X-CoopEngine-Environment isolated-synthetic always;
    location / { proxy_pass http://member:3200; proxy_set_header Host $host; }
  }
}

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository invariants
        run: pnpm verify:repo

      # Workspace typechecking resolves @coopengine/* declarations from their
      # built dist, so packages are built before typechecking.
      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  integration:
    name: Integration (real PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://coopengine:coopengine@localhost:5432/coopengine
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create non-superuser app role (RLS must bind in CI)
        run: node scripts/ci-init-db.mjs

      - name: Build packages
        run: pnpm build

      - name: Apply migrations
        working-directory: packages/db
        run: pnpm db:migrate

      - name: Enforce RLS + install ledger guards
        working-directory: packages/db
        run: pnpm db:force-rls

      - name: Seed RBAC
        working-directory: packages/db
        run: pnpm db:seed

      - name: DB integration tests (tenant isolation)
        working-directory: packages/db
        run: pnpm test:integration

      - name: API integration tests (auth · ledger · savings · loans · payroll)
        working-directory: apps/api
        run: pnpm test:integration

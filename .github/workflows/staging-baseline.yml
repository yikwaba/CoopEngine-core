name: Isolated staging baseline
on:
  pull_request:
    paths:
      - staging/**
      - scripts/staging/**
      - .dockerignore
      - .github/workflows/staging-baseline.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse Windows recovery installer
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/staging/install-recovery.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
      - name: Check staging guards and shell syntax
        run: |
          node --test scripts/staging/guard.test.mjs
          bash -n scripts/staging/run.sh staging/init-db.sh staging/migrate.sh
      - name: Prepare and mask private synthetic credentials
        run: |
          node scripts/staging/prepare.mjs
          while IFS='=' read -r name value; do
            if [ "$name" != STAGING_SOURCE_SHA ]; then echo "::add-mask::$value"; fi
          done < .staging/compose.env
      - name: Build isolated stack
        run: bash scripts/staging/run.sh
      - name: Await synthetic fixtures and isolation baseline
        run: |
          fixture_id=$(docker compose --project-name coopengine-recovery-staging --env-file .staging/compose.env -f staging/compose.yml ps -a -q fixtures)
          test -n "$fixture_id"
          result=$(docker wait "$fixture_id")
          docker logs "$fixture_id"
          test "$result" = 0
          curl --fail --silent http://localhost:4399/api/v1/health
          curl --fail --silent --output /dev/null http://localhost:4310/login
          curl --fail --silent --output /dev/null http://localhost:4320/login
      - name: Check recovery session and member HTTP journeys
        run: docker compose --project-name coopengine-recovery-staging --env-file .staging/compose.env -f staging/compose.yml run --rm --no-deps fixtures node scripts/staging/recovery-smoke.mjs
      - name: Run PowerShell installer against the isolated Docker stack
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'recovery-source.zip'
          $source = Join-Path $env:RUNNER_TEMP 'recovery-source'
          $sha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve source commit.' }
          git archive --format=zip "--output=$archive" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot export source.' }
          Expand-Archive $archive $source
          & "$source/scripts/staging/install-recovery.ps1" -SourcePath $source -ProjectPath $PWD.Path -SourceSha $sha
      - name: Inspect failed synthetic startup
        if: failure()
        run: docker compose --project-name coopengine-recovery-staging --env-file .staging/compose.env -f staging/compose.yml logs --no-color migrate api fixtures gateway
      - name: Stop isolated resources (retain no data)
        if: always()
        run: docker compose --project-name coopengine-recovery-staging --env-file .staging/compose.env -f staging/compose.yml down --volumes || true

[Definition]
# Caddy JSON access log (structured, single line per request).
# The epoch timestamp lives in the "ts" field, read via {EPOCH}.
datepattern = "ts":{EPOCH}(?:\.\d+)?
# Failed authentication attempts against the Co-opEngine API through the proxy.
failregex = ^.*"remote_ip":"<HOST>".*"uri":"/api/v1/auth/[^"]*".*"status":(?:401|403|429).*$
ignoreregex =
